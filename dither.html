<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image to ASCII Ditherer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Space Grotesk', -apple-system, sans-serif;
      background: #050505;
      color: #fafafa;
      min-height: 100vh;
      padding: 40px;
    }
    h1 { margin-bottom: 20px; font-size: 1.5rem; }
    .controls {
      display: flex;
      gap: 20px;
      margin-bottom: 30px;
      flex-wrap: wrap;
      align-items: center;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    label { font-size: 0.8rem; color: #888; }
    input[type="file"] {
      background: #0a0a0a;
      border: 1px solid #1a1a1a;
      padding: 10px;
      border-radius: 8px;
      color: #fff;
    }
    input[type="range"] {
      width: 150px;
    }
    select, button {
      background: #0a0a0a;
      border: 1px solid #1a1a1a;
      padding: 10px 20px;
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
    }
    button:hover { border-color: #00ff88; color: #00ff88; }
    .output-area {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
    }
    .preview {
      background: #0a0a0a;
      border: 1px solid #1a1a1a;
      border-radius: 12px;
      padding: 20px;
    }
    .preview h3 {
      font-size: 0.9rem;
      color: #888;
      margin-bottom: 15px;
    }
    #original-img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
    }
    #ascii-output {
      font-family: 'Space Mono', monospace;
      font-size: 6px;
      line-height: 1.1;
      white-space: pre;
      color: #00ff88;
      background: #050505;
      padding: 10px;
      border-radius: 8px;
      overflow: auto;
      max-height: 500px;
    }
    #copy-btn {
      margin-top: 15px;
    }
    canvas { display: none; }
    .char-sets {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .char-set {
      padding: 8px 16px;
      background: #0a0a0a;
      border: 1px solid #1a1a1a;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Space Mono', monospace;
      font-size: 0.75rem;
    }
    .char-set:hover, .char-set.active {
      border-color: #00ff88;
      color: #00ff88;
    }
    .export-code {
      margin-top: 20px;
      background: #0a0a0a;
      border: 1px solid #1a1a1a;
      border-radius: 8px;
      padding: 15px;
    }
    .export-code h4 {
      font-size: 0.8rem;
      color: #888;
      margin-bottom: 10px;
    }
    .export-code pre {
      font-family: 'Space Mono', monospace;
      font-size: 0.7rem;
      color: #00ff88;
      overflow: auto;
      max-height: 200px;
    }
  </style>
</head>
<body>
  <h1>Image → ASCII Ditherer</h1>

  <div class="controls">
    <div class="control-group">
      <label>Upload Image</label>
      <input type="file" id="image-input" accept="image/*">
    </div>

    <div class="control-group">
      <label>Width (chars): <span id="width-val">80</span></label>
      <input type="range" id="width-slider" min="40" max="150" value="80">
    </div>

    <div class="control-group">
      <label>Contrast: <span id="contrast-val">1.2</span></label>
      <input type="range" id="contrast-slider" min="0.5" max="3" step="0.1" value="1.2">
    </div>

    <div class="control-group">
      <label>Brightness: <span id="brightness-val">0</span></label>
      <input type="range" id="brightness-slider" min="-50" max="50" value="0">
    </div>

    <div class="control-group">
      <label>Invert</label>
      <input type="checkbox" id="invert-check">
    </div>
  </div>

  <div class="control-group" style="margin-bottom: 30px;">
    <label>Character Set</label>
    <div class="char-sets">
      <div class="char-set active" data-chars=" .:-=+*#%@">Standard</div>
      <div class="char-set" data-chars=" ░▒▓█">Blocks</div>
      <div class="char-set" data-chars=" ·:;+=xX$&#">Dense</div>
      <div class="char-set" data-chars=" .oO0@">Minimal</div>
      <div class="char-set" data-chars="⠀⠁⠂⠃⠄⠅⠆⠇⡀⡁⡂⡃⡄⡅⡆⡇⢀⢁⢂⢃⢄⢅⢆⢇⣀⣁⣂⣃⣄⣅⣆⣇⠈⠉⠊⠋⠌⠍⠎⠏⡈⡉⡊⡋⡌⡍⡎⡏⢈⢉⢊⢋⢌⢍⢎⢏⣈⣉⣊⣋⣌⣍⣎⣏">Braille</div>
    </div>
  </div>

  <div class="output-area">
    <div class="preview">
      <h3>Original</h3>
      <img id="original-img" src="" alt="Original image">
    </div>

    <div class="preview">
      <h3>ASCII Output</h3>
      <pre id="ascii-output">Upload an image to see the ASCII art here...</pre>
      <button id="copy-btn">Copy ASCII</button>
    </div>
  </div>

  <div class="export-code">
    <h4>Export as JS String (for main.js)</h4>
    <pre id="js-export">// Upload an image first...</pre>
    <button id="copy-js-btn">Copy JS Code</button>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const imageInput = document.getElementById('image-input');
    const widthSlider = document.getElementById('width-slider');
    const contrastSlider = document.getElementById('contrast-slider');
    const brightnessSlider = document.getElementById('brightness-slider');
    const invertCheck = document.getElementById('invert-check');
    const originalImg = document.getElementById('original-img');
    const asciiOutput = document.getElementById('ascii-output');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const charSets = document.querySelectorAll('.char-set');

    let currentImage = null;
    let currentChars = ' .:-=+*#%@';

    // Character set selection
    charSets.forEach(set => {
      set.addEventListener('click', () => {
        charSets.forEach(s => s.classList.remove('active'));
        set.classList.add('active');
        currentChars = set.dataset.chars;
        if (currentImage) convertToAscii();
      });
    });

    // Update value displays
    widthSlider.addEventListener('input', () => {
      document.getElementById('width-val').textContent = widthSlider.value;
      if (currentImage) convertToAscii();
    });
    contrastSlider.addEventListener('input', () => {
      document.getElementById('contrast-val').textContent = contrastSlider.value;
      if (currentImage) convertToAscii();
    });
    brightnessSlider.addEventListener('input', () => {
      document.getElementById('brightness-val').textContent = brightnessSlider.value;
      if (currentImage) convertToAscii();
    });
    invertCheck.addEventListener('change', () => {
      if (currentImage) convertToAscii();
    });

    // Load image
    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        currentImage = new Image();
        currentImage.onload = () => {
          originalImg.src = currentImage.src;
          convertToAscii();
        };
        currentImage.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    function convertToAscii() {
      if (!currentImage) return;

      const targetWidth = parseInt(widthSlider.value);
      const aspectRatio = currentImage.height / currentImage.width;
      // Compensate for character aspect ratio (chars are taller than wide)
      const targetHeight = Math.floor(targetWidth * aspectRatio * 0.5);

      canvas.width = targetWidth;
      canvas.height = targetHeight;

      // Draw image scaled down
      ctx.drawImage(currentImage, 0, 0, targetWidth, targetHeight);

      // Get pixel data
      const imageData = ctx.getImageData(0, 0, targetWidth, targetHeight);
      const pixels = imageData.data;

      const contrast = parseFloat(contrastSlider.value);
      const brightness = parseInt(brightnessSlider.value);
      const invert = invertCheck.checked;

      let ascii = '';

      for (let y = 0; y < targetHeight; y++) {
        for (let x = 0; x < targetWidth; x++) {
          const idx = (y * targetWidth + x) * 4;
          let r = pixels[idx];
          let g = pixels[idx + 1];
          let b = pixels[idx + 2];

          // Convert to grayscale (luminance)
          let gray = 0.299 * r + 0.587 * g + 0.114 * b;

          // Apply brightness
          gray += brightness;

          // Apply contrast
          gray = ((gray - 128) * contrast) + 128;

          // Clamp
          gray = Math.max(0, Math.min(255, gray));

          // Invert if needed
          if (invert) gray = 255 - gray;

          // Map to character
          const charIdx = Math.floor((gray / 255) * (currentChars.length - 1));
          ascii += currentChars[charIdx];
        }
        ascii += '\n';
      }

      asciiOutput.textContent = ascii;

      // Generate JS export
      const escapedAscii = ascii.replace(/\\/g, '\\\\').replace(/`/g, '\\`').replace(/\$/g, '\\$');
      const jsCode = `const asciiArt = \`${escapedAscii}\`;`;
      document.getElementById('js-export').textContent = jsCode;
    }

    // Copy buttons
    document.getElementById('copy-btn').addEventListener('click', () => {
      navigator.clipboard.writeText(asciiOutput.textContent);
      document.getElementById('copy-btn').textContent = 'Copied!';
      setTimeout(() => {
        document.getElementById('copy-btn').textContent = 'Copy ASCII';
      }, 2000);
    });

    document.getElementById('copy-js-btn').addEventListener('click', () => {
      navigator.clipboard.writeText(document.getElementById('js-export').textContent);
      document.getElementById('copy-js-btn').textContent = 'Copied!';
      setTimeout(() => {
        document.getElementById('copy-js-btn').textContent = 'Copy JS Code';
      }, 2000);
    });
  </script>
</body>
</html>
