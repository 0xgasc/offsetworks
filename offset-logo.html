<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offset - Logo Concepts</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: #030303;
      color: #fafafa;
      min-height: 100vh;
      padding: 40px;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background:
        radial-gradient(ellipse at 20% 20%, rgba(0, 255, 136, 0.03) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(0, 221, 255, 0.03) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(157, 78, 221, 0.02) 0%, transparent 60%);
      pointer-events: none;
      z-index: -1;
      animation: bgShift 20s ease-in-out infinite;
    }

    @keyframes bgShift {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .header {
      text-align: center;
      margin-bottom: 48px;
    }

    .header h1 {
      font-family: 'Space Mono', monospace;
      font-size: 0.85rem;
      font-weight: 400;
      color: #444;
      letter-spacing: 0.2em;
      margin-bottom: 16px;
    }

    .controls {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      background: #111;
      border: 1px solid #222;
      color: #666;
      padding: 8px 16px;
      border-radius: 6px;
      font-family: 'Space Mono', monospace;
      font-size: 0.7rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn:hover {
      background: #1a1a1a;
      border-color: #333;
      color: #fff;
    }

    .btn.active {
      border-color: currentColor;
      color: #fff;
      background: #0a0a0a;
    }

    .btn[data-color="cyber"].active { color: #00ff88; border-color: #00ff88; }
    .btn[data-color="ice"].active { color: #00ddff; border-color: #00ddff; }
    .btn[data-color="vapor"].active { color: #ff71ce; border-color: #ff71ce; }
    .btn[data-color="gold"].active { color: #ffcc00; border-color: #ffcc00; }
    .btn[data-color="fire"].active { color: #ff4400; border-color: #ff4400; }
    .btn[data-color="royal"].active { color: #9d4edd; border-color: #9d4edd; }
    .btn[data-color="matrix"].active { color: #00ff00; border-color: #00ff00; }
    .btn[data-color="mono"].active { color: #fff; border-color: #fff; }

    .logo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
      gap: 24px;
      max-width: 1800px;
      margin: 0 auto;
    }

    .logo-card {
      background: #0a0a0a;
      border: 1px solid #1a1a1a;
      border-radius: 8px;
      padding: 32px;
      text-align: center;
      transition: all 0.2s ease;
      position: relative;
    }

    .logo-card:hover {
      border-color: #333;
      transform: translateY(-2px);
    }

    .logo-container {
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .logo-container pre {
      font-family: 'Space Mono', monospace;
      font-size: 14px;
      line-height: 1.3;
      white-space: pre;
      transition: color 0.3s;
    }

    .logo-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .logo-name {
      font-family: 'Space Mono', monospace;
      font-size: 0.7rem;
      color: #333;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .logo-num {
      font-family: 'Space Mono', monospace;
      font-size: 0.65rem;
      color: #222;
    }

    /* Color modes - always visible */
    body.color-mono .logo-container pre { color: #888; }
    body.color-mono .logo-card:hover pre { color: #fff; }

    body.color-cyber .logo-container pre { color: #00ff88; }
    body.color-cyber .logo-card:hover pre { color: #00ff88; filter: drop-shadow(0 0 8px #00ff8866); }

    body.color-ice .logo-container pre { color: #00ddff; }
    body.color-ice .logo-card:hover pre { color: #00ddff; filter: drop-shadow(0 0 8px #00ddff66); }

    body.color-vapor .logo-container pre { color: #ff71ce; }
    body.color-vapor .logo-card:hover pre { color: #ff71ce; filter: drop-shadow(0 0 8px #ff71ce66); }

    body.color-gold .logo-container pre { color: #ffcc00; }
    body.color-gold .logo-card:hover pre { color: #ffcc00; filter: drop-shadow(0 0 8px #ffcc0066); }

    body.color-fire .logo-container pre { color: #ff4400; }
    body.color-fire .logo-card:hover pre { color: #ff4400; filter: drop-shadow(0 0 8px #ff440066); }

    body.color-royal .logo-container pre { color: #9d4edd; }
    body.color-royal .logo-card:hover pre { color: #9d4edd; filter: drop-shadow(0 0 8px #9d4edd66); }

    body.color-matrix .logo-container pre { color: #00ff00; }
    body.color-matrix .logo-card:hover pre { color: #00ff00; filter: drop-shadow(0 0 8px #00ff0066); }

    .shuffle-all {
      position: fixed;
      bottom: 32px;
      right: 32px;
      background: #111;
      border: 1px solid #222;
      color: #666;
      padding: 10px 20px;
      border-radius: 6px;
      font-family: 'Space Mono', monospace;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.15s ease;
      z-index: 100;
    }

    .shuffle-all:hover {
      border-color: #00ff88;
      color: #00ff88;
      background: #0a0a0a;
    }

    .shuffle-all span {
      display: inline-block;
      margin-right: 8px;
      transition: transform 0.3s;
    }

    .shuffle-all:hover span {
      transform: rotate(180deg);
    }

    /* Press R hint */
    .hint {
      position: fixed;
      bottom: 32px;
      left: 32px;
      font-family: 'Space Mono', monospace;
      font-size: 0.6rem;
      color: #333;
      padding: 8px 12px;
      background: #0a0a0a;
      border: 1px solid #1a1a1a;
      border-radius: 6px;
    }
  </style>
</head>
<body class="color-cyber">
  <div class="header">
    <h1>OFFSET — LOGO SYSTEM</h1>
    <div class="controls">
      <button class="btn" data-color="mono">Mono</button>
      <button class="btn active" data-color="cyber">Cyber</button>
      <button class="btn" data-color="ice">Ice</button>
      <button class="btn" data-color="vapor">Vapor</button>
      <button class="btn" data-color="gold">Gold</button>
      <button class="btn" data-color="fire">Fire</button>
      <button class="btn" data-color="royal">Royal</button>
      <button class="btn" data-color="matrix">Matrix</button>
    </div>
  </div>

  <div class="logo-grid" id="logo-grid"></div>

  <button class="shuffle-all" id="shuffle-btn">
    <span>↻</span> Regenerate All
  </button>

  <div class="hint">Press R to shuffle</div>

  <a href="trippy-bg.html" class="page-link" style="position:fixed;top:32px;right:32px;font-size:0.65rem;color:#666;text-decoration:none;border:1px solid #222;padding:10px 16px;border-radius:6px;background:#111;transition:all 0.15s ease;">Trippy BG →</a>

  <script>
    // Logo animation definitions
    const logoAnimations = {

      // 1. Minimal with breathing dot
      breathing: {
        name: 'Breathing',
        render: (time) => {
          const pulse = (Math.sin(time * 0.003) + 1) / 2;
          const dot = pulse > 0.5 ? '●' : '○';
          return `OFFSET ${dot} WORKS`;
        }
      },

      // 2. Spaced letters
      spaced: {
        name: 'Spaced',
        render: (time) => {
          const spacing = Math.floor((Math.sin(time * 0.002) + 1) * 1.5) + 1;
          const space = ' '.repeat(spacing);
          return 'O F F S E T'.split(' ').join(space) + '   ' + 'W O R K S'.split(' ').join(space);
        }
      },

      // 3. Orbital
      orbital: {
        name: 'Orbital',
        render: (time) => {
          const chars = '·∘○◯●';
          const pos = Math.floor((time * 0.01) % 12);
          let orbit = '';
          for (let i = 0; i < 12; i++) {
            orbit += i === pos ? '●' : '·';
          }
          return `  ${orbit.slice(0,6)}\n  OFFSET\n  ${orbit.slice(6)}`;
        }
      },

      // 4. Scan reveal
      scan: {
        name: 'Scan',
        render: (time) => {
          const text = 'OFFSET';
          const pos = Math.floor((time * 0.008) % (text.length + 4));
          let out = '';
          for (let i = 0; i < text.length; i++) {
            if (i < pos - 2) out += text[i];
            else if (i < pos) out += '▓';
            else out += '░';
          }
          return out;
        }
      },

      // 5. Glitch minimal
      glitchMin: {
        name: 'Glitch',
        render: (time) => {
          const text = 'OFFSET';
          const glitchFrame = Math.floor(time * 0.01) % 60;
          if (glitchFrame > 55) {
            const pos = Math.floor(Math.random() * text.length);
            return text.slice(0, pos) + '_' + text.slice(pos + 1);
          }
          return text;
        }
      },

      // 6. Brackets
      brackets: {
        name: 'Brackets',
        render: (time) => {
          const pulse = Math.floor(time * 0.003) % 2;
          const l = pulse ? '[' : '⟦';
          const r = pulse ? ']' : '⟧';
          return `${l} OFFSET ${r}`;
        }
      },

      // 7. Underline sweep
      underline: {
        name: 'Underline',
        render: (time) => {
          const text = 'OFFSET';
          const pos = Math.floor((time * 0.015) % (text.length * 2));
          let line = '';
          for (let i = 0; i < text.length; i++) {
            if (i === pos || i === pos - text.length) line += '─';
            else line += ' ';
          }
          return text + '\n' + line;
        }
      },

      // 8. Binary fade
      binary: {
        name: 'Binary',
        render: (time) => {
          const text = 'OFFSET';
          const phase = (time * 0.002) % (Math.PI * 2);
          let out = '';
          for (let i = 0; i < text.length; i++) {
            const threshold = Math.sin(phase + i * 0.5);
            if (threshold > 0.3) out += text[i];
            else if (threshold > -0.3) out += Math.random() > 0.5 ? '1' : '0';
            else out += ' ';
          }
          return out;
        }
      },

      // 9. Stack offset
      stack: {
        name: 'Stack',
        render: (time) => {
          const offset = Math.floor(Math.sin(time * 0.002) * 2) + 2;
          return ' '.repeat(offset) + 'OFFSET\n' + 'WORKS';
        }
      },

      // 10. Cursor blink
      cursor: {
        name: 'Cursor',
        render: (time) => {
          const cursor = Math.floor(time * 0.004) % 2 ? '▎' : ' ';
          return `OFFSET${cursor}`;
        }
      },

      // 11. Split
      split: {
        name: 'Split',
        render: (time) => {
          const gap = Math.floor((Math.sin(time * 0.003) + 1) * 3);
          return 'OFFSET' + ' '.repeat(gap + 2) + 'WORKS';
        }
      },

      // 12. Dots
      dots: {
        name: 'Dots',
        render: (time) => {
          const phase = Math.floor(time * 0.005) % 4;
          const dots = ['·', ':', '∴', '∷'][phase];
          return `OFFSET ${dots} WORKS`;
        }
      },

      // 13. Vertical
      vertical: {
        name: 'Vertical',
        render: (time) => {
          const pulse = Math.sin(time * 0.003);
          const bar = pulse > 0 ? '│' : '¦';
          return `OFFSET ${bar} WORKS`;
        }
      },

      // 14. Wave text
      waveText: {
        name: 'Wave',
        render: (time) => {
          const text = 'OFFSET';
          let out = '';
          for (let i = 0; i < text.length; i++) {
            const wave = Math.sin(time * 0.005 + i * 0.5);
            if (wave > 0.3) out += text[i].toUpperCase();
            else out += text[i].toLowerCase();
          }
          return out;
        }
      },

      // 15. Arrows
      arrows: {
        name: 'Arrows',
        render: (time) => {
          const phase = Math.floor(time * 0.004) % 3;
          const arrows = ['→', '⟶', '⟹'][phase];
          return `OFFSET ${arrows} WORKS`;
        }
      },

      // 16. Box minimal
      boxMin: {
        name: 'Box',
        render: (time) => {
          const pulse = Math.floor(time * 0.003) % 2;
          const corner = pulse ? '┌' : '╭';
          const cornerR = pulse ? '┐' : '╮';
          const cornerBL = pulse ? '└' : '╰';
          const cornerBR = pulse ? '┘' : '╯';
          return `${corner}──────────────${cornerR}\n│ OFFSET │\n${cornerBL}──────────────${cornerBR}`;
        }
      },

      // 17. Radar
      radar: {
        name: 'Radar',
        render: (time) => {
          const chars = '◜◝◞◟';
          const idx = Math.floor(time * 0.008) % 4;
          return `${chars[idx]} OFFSET ${chars[(idx + 2) % 4]}`;
        }
      },

      // 18. Loading
      loading: {
        name: 'Loading',
        render: (time) => {
          const frames = ['⠋', '⠙', '⠹', '⠸', '⠼', '⠴', '⠦', '⠧', '⠇', '⠏'];
          const idx = Math.floor(time * 0.01) % frames.length;
          return `${frames[idx]} OFFSET`;
        }
      },

      // 19. Slash
      slash: {
        name: 'Slash',
        render: (time) => {
          const phase = Math.floor(time * 0.006) % 4;
          const slash = ['/', '|', '\\', '|'][phase];
          return `OFFSET ${slash} WORKS`;
        }
      },

      // 20. Echo
      echo: {
        name: 'Echo',
        render: (time) => {
          const phase = Math.sin(time * 0.002);
          if (phase > 0.5) {
            return '  OFFSET\n OFFSET\nOFFSET';
          } else if (phase > 0) {
            return ' OFFSET\nOFFSET';
          }
          return 'OFFSET';
        }
      },

      // 21. Diamond
      diamond: {
        name: 'Diamond',
        render: (time) => {
          const pulse = Math.floor(time * 0.004) % 2;
          const d = pulse ? '◇' : '◆';
          return `${d} OFFSET ${d}`;
        }
      },

      // 22. Tag
      tag: {
        name: 'Tag',
        render: (time) => {
          const pulse = Math.floor(time * 0.003) % 2;
          return pulse ? '<OFFSET/>' : '<OFFSET>';
        }
      },

      // 23. Hash
      hash: {
        name: 'Hash',
        render: (time) => {
          const pulse = Math.floor(time * 0.003) % 2;
          const h = pulse ? '#' : '##';
          return `${h}OFFSET`;
        }
      },

      // 24. Signal
      signal: {
        name: 'Signal',
        render: (time) => {
          const bars = ['▁', '▂', '▃', '▄', '▅', '▆', '▇', '█'];
          let signal = '';
          for (let i = 0; i < 4; i++) {
            const idx = Math.floor((Math.sin(time * 0.005 + i) + 1) * 3.5);
            signal += bars[idx];
          }
          return `${signal} OFFSET`;
        }
      },

      // 25. Typewriter
      typewriter: {
        name: 'Typewriter',
        render: (time) => {
          const text = 'OFFSET';
          const pos = Math.floor((time * 0.004) % (text.length + 8));
          const cursor = Math.floor(time * 0.008) % 2 ? '█' : ' ';
          if (pos < text.length) {
            return text.slice(0, pos) + cursor;
          }
          return text + cursor;
        }
      },

      // 26. Minimal Plus
      minPlus: {
        name: 'Plus',
        render: (time) => {
          const pulse = Math.floor(time * 0.003) % 2;
          const p = pulse ? '+' : '×';
          return `OFFSET ${p} WORKS`;
        }
      },

      // 27. Colon
      colon: {
        name: 'Colon',
        render: (time) => {
          const pulse = Math.floor(time * 0.003) % 2;
          return pulse ? 'OFFSET : WORKS' : 'OFFSET   WORKS';
        }
      },

      // 28. Line
      line: {
        name: 'Line',
        render: (time) => {
          const width = Math.floor((Math.sin(time * 0.003) + 1) * 6) + 2;
          return 'OFFSET\n' + '─'.repeat(width);
        }
      },

      // 29. Stars
      stars: {
        name: 'Stars',
        render: (time) => {
          const phase = Math.floor(time * 0.005) % 3;
          const star = ['✦', '✧', '·'][phase];
          return `${star} OFFSET ${star}`;
        }
      },

      // 30. Block
      block: {
        name: 'Block',
        render: (time) => {
          const pulse = (Math.sin(time * 0.003) + 1) / 2;
          const block = pulse > 0.5 ? '█' : '▓';
          return `${block} OFFSET ${block}`;
        }
      }
    };

    // State
    let currentLogos = [];
    const GRID_SIZE = 12;

    // Shuffle array
    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // Initialize grid
    function initGrid() {
      const grid = document.getElementById('logo-grid');
      grid.innerHTML = '';

      const keys = Object.keys(logoAnimations);
      currentLogos = shuffle(keys).slice(0, GRID_SIZE);

      currentLogos.forEach((key, idx) => {
        const anim = logoAnimations[key];
        const card = document.createElement('div');
        card.className = 'logo-card';
        card.innerHTML = `
          <div class="logo-container">
            <pre id="logo-${idx}"></pre>
          </div>
          <div class="logo-meta">
            <span class="logo-name">${anim.name}</span>
            <span class="logo-num">${String(idx + 1).padStart(2, '0')}/${GRID_SIZE}</span>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Animation loop
    function animate() {
      const time = performance.now();

      currentLogos.forEach((key, idx) => {
        const canvas = document.getElementById(`logo-${idx}`);
        if (canvas && logoAnimations[key]) {
          canvas.textContent = logoAnimations[key].render(time);
        }
      });

      requestAnimationFrame(animate);
    }

    // Color toggle
    document.querySelectorAll('.btn[data-color]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.btn[data-color]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.body.className = `color-${btn.dataset.color}`;
      });
    });

    // Shuffle button
    document.getElementById('shuffle-btn').addEventListener('click', () => {
      initGrid();
    });

    // Keyboard shortcut
    document.addEventListener('keydown', (e) => {
      if (e.key === 'r' || e.key === 'R') {
        initGrid();
      }
    });

    // Init
    initGrid();
    animate();
  </script>
</body>
</html>
