<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offset - Trippy Backgrounds</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Space Mono', monospace;
      background: #000;
      color: #fff;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Background canvas */
    #bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      font-size: 10px;
      line-height: 1.1;
      white-space: pre;
      overflow: hidden;
      z-index: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Color modes */
    .mode-void #bg-canvas { color: #222; }
    .mode-cyber #bg-canvas { color: #00ff88; }
    .mode-neon #bg-canvas {
      background: linear-gradient(135deg, #ff00ff22, #00ffff22);
      color: #ff00ff;
    }
    .mode-fire #bg-canvas {
      background: linear-gradient(180deg, #000, #1a0500);
      color: #ff4400;
    }
    .mode-ice #bg-canvas {
      background: linear-gradient(180deg, #000, #001520);
      color: #00ddff;
    }
    .mode-acid #bg-canvas {
      color: #39ff14;
      text-shadow: 0 0 10px #39ff14;
    }
    .mode-vapor #bg-canvas {
      background: linear-gradient(135deg, #0d021f, #1a0a2e);
      color: #ff71ce;
    }
    .mode-blood #bg-canvas {
      background: #0a0000;
      color: #8b0000;
    }
    .mode-gold #bg-canvas {
      background: #0a0800;
      color: #ffcc00;
    }
    .mode-rainbow #bg-canvas {
      animation: rainbow-hue 5s linear infinite;
    }
    @keyframes rainbow-hue {
      0% { filter: hue-rotate(0deg); color: #ff0000; }
      25% { color: #00ff00; }
      50% { color: #0000ff; }
      75% { color: #ff00ff; }
      100% { filter: hue-rotate(360deg); color: #ff0000; }
    }

    /* Logo overlay */
    .logo-overlay {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      text-align: center;
      pointer-events: none;
      padding: 60px 80px;
      background: #0a0a0a;
      border: 1px solid #1a1a1a;
      border-radius: 12px;
    }

    .logo-text {
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      color: #fff;
      text-shadow: 0 0 40px rgba(255,255,255,0.3);
    }

    .logo-sub {
      font-size: 0.8rem;
      letter-spacing: 0.3em;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 16px;
    }

    /* Controls */
    .controls {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
      z-index: 100;
      max-width: 90vw;
      padding: 10px 14px;
      background: #0a0a0a;
      border: 1px solid #1a1a1a;
      border-radius: 8px;
    }

    .btn {
      background: #111;
      border: 1px solid #222;
      color: #666;
      padding: 8px 14px;
      border-radius: 6px;
      font-family: 'Space Mono', monospace;
      font-size: 0.65rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn:hover {
      border-color: #333;
      color: #fff;
      background: #1a1a1a;
    }

    .btn.active {
      background: #0a0a0a;
      color: #fff;
      border-color: #444;
    }

    .effect-controls {
      position: fixed;
      top: 32px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      z-index: 100;
      padding: 10px 14px;
      background: #0a0a0a;
      border: 1px solid #1a1a1a;
      border-radius: 8px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 90vw;
    }

    /* Info panel */
    .info {
      position: fixed;
      top: 32px;
      right: 32px;
      font-size: 0.6rem;
      color: #666;
      text-align: right;
      z-index: 100;
      padding: 10px 14px;
      background: #0a0a0a;
      border: 1px solid #1a1a1a;
      border-radius: 6px;
    }

    .hint {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.55rem;
      color: #444;
      z-index: 100;
      padding: 8px 14px;
      background: #0a0a0a;
      border: 1px solid #1a1a1a;
      border-radius: 6px;
    }
  </style>
</head>
<body class="mode-cyber">

  <pre id="bg-canvas"></pre>

  <div class="logo-overlay">
    <div class="logo-text">OFFSET</div>
    <div class="logo-sub">DESIGN STUDIO</div>
  </div>

  <div class="effect-controls">
    <button class="btn active" data-effect="plasma">Plasma</button>
    <button class="btn" data-effect="matrix">Matrix</button>
    <button class="btn" data-effect="wave">Wave</button>
    <button class="btn" data-effect="spiral">Spiral</button>
    <button class="btn" data-effect="tunnel">Tunnel</button>
    <button class="btn" data-effect="rain">Rain</button>
    <button class="btn" data-effect="noise">Noise</button>
    <button class="btn" data-effect="pulse">Pulse</button>
    <button class="btn" data-effect="warp">Warp</button>
    <button class="btn" data-effect="dna">DNA</button>
  </div>

  <div class="controls">
    <button class="btn" data-mode="void">Void</button>
    <button class="btn active" data-mode="cyber">Cyber</button>
    <button class="btn" data-mode="neon">Neon</button>
    <button class="btn" data-mode="fire">Fire</button>
    <button class="btn" data-mode="ice">Ice</button>
    <button class="btn" data-mode="acid">Acid</button>
    <button class="btn" data-mode="vapor">Vapor</button>
    <button class="btn" data-mode="blood">Blood</button>
    <button class="btn" data-mode="gold">Gold</button>
    <button class="btn" data-mode="rainbow">Rainbow</button>
  </div>

  <div class="info">
    <div id="fps">60 FPS</div>
    <div id="effect-name">PLASMA</div>
  </div>

  <div class="hint">Press 1-0 for effects • Space to shuffle • Arrow keys for colors</div>

  <a href="offset-logo.html" style="position:fixed;top:32px;left:32px;font-size:0.6rem;color:#666;text-decoration:none;border:1px solid #222;padding:10px 16px;border-radius:6px;z-index:100;background:#111;transition:all 0.15s ease;">← Logos</a>

  <script>
    const canvas = document.getElementById('bg-canvas');
    let cols, rows;
    let currentEffect = 'plasma';
    let lastTime = performance.now();
    let frameCount = 0;

    // Calculate grid size
    function resize() {
      const charWidth = 6;
      const charHeight = 11;
      cols = Math.ceil(window.innerWidth / charWidth) + 5;
      rows = Math.ceil(window.innerHeight / charHeight) + 5;
    }
    resize();
    window.addEventListener('resize', resize);

    // Character sets
    const chars = {
      blocks: ' ░▒▓█',
      dense: ' .:-=+*#%@',
      braille: '⠀⠁⠂⠃⠄⠅⠆⠇⡀⡁⡂⡃⡄⡅⡆⡇⢀⢁⢂⢃⢄⢅⢆⢇⣀⣁⣂⣃⣄⣅⣆⣇⣈⣉⣊⣋⣌⣍⣎⣏⣐⣑⣒⣓⣔⣕⣖⣗⣘⣙⣚⣛⣜⣝⣞⣟⣠⣡⣢⣣⣤⣥⣦⣧⣨⣩⣪⣫⣬⣭⣮⣯⣰⣱⣲⣳⣴⣵⣶⣷⣸⣹⣺⣻⣼⣽⣾⣿',
      matrix: 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789',
      symbols: '◇◆○●□■△▲▽▼◁◀▷▶☆★',
      minimal: ' ·:+*',
      waves: ' ~≈∿≋',
    };

    // Effects
    const effects = {
      plasma: (time) => {
        let out = '';
        const t = time * 0.001;
        for (let y = 0; y < rows; y++) {
          for (let x = 0; x < cols; x++) {
            const v1 = Math.sin(x * 0.05 + t);
            const v2 = Math.sin((y * 0.05 + t) * 0.7);
            const v3 = Math.sin((x * 0.03 + y * 0.04 + t) * 0.8);
            const v4 = Math.sin(Math.sqrt((x - cols/2) ** 2 + (y - rows/2) ** 2) * 0.05 + t);
            const v = (v1 + v2 + v3 + v4) / 4;
            const idx = Math.floor((v + 1) * 2.4);
            out += chars.blocks[Math.max(0, Math.min(4, idx))];
          }
          out += '\n';
        }
        return out;
      },

      matrix: (() => {
        let drops = [];
        return (time) => {
          if (drops.length !== cols) {
            drops = Array(cols).fill(0).map(() => ({
              y: Math.random() * rows * 2 - rows,
              speed: 0.3 + Math.random() * 0.7,
              chars: Array(rows).fill('').map(() => chars.matrix[Math.floor(Math.random() * chars.matrix.length)])
            }));
          }
          const grid = Array(rows).fill(null).map(() => Array(cols).fill(' '));
          drops.forEach((drop, x) => {
            drop.y += drop.speed;
            if (drop.y > rows + 20) {
              drop.y = -20;
              drop.speed = 0.3 + Math.random() * 0.7;
            }
            for (let i = 0; i < 15; i++) {
              const y = Math.floor(drop.y) - i;
              if (y >= 0 && y < rows) {
                if (Math.random() < 0.02) drop.chars[y % drop.chars.length] = chars.matrix[Math.floor(Math.random() * chars.matrix.length)];
                grid[y][x] = drop.chars[y % drop.chars.length];
              }
            }
          });
          return grid.map(row => row.join('')).join('\n');
        };
      })(),

      wave: (time) => {
        let out = '';
        const t = time * 0.002;
        for (let y = 0; y < rows; y++) {
          for (let x = 0; x < cols; x++) {
            const wave1 = Math.sin(x * 0.08 + t);
            const wave2 = Math.sin(y * 0.1 + t * 1.3);
            const wave3 = Math.sin((x + y) * 0.05 + t * 0.7);
            const v = (wave1 + wave2 + wave3) / 3;
            const idx = Math.floor((v + 1) * 2.4);
            out += chars.blocks[Math.max(0, Math.min(4, idx))];
          }
          out += '\n';
        }
        return out;
      },

      spiral: (time) => {
        let out = '';
        const cx = cols / 2;
        const cy = rows / 2;
        const t = time * 0.002;
        for (let y = 0; y < rows; y++) {
          for (let x = 0; x < cols; x++) {
            const dx = (x - cx) / 2;
            const dy = y - cy;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const angle = Math.atan2(dy, dx);
            const spiral = Math.sin(dist * 0.2 - angle * 3 + t * 2);
            const idx = Math.floor((spiral + 1) * 2.4);
            out += chars.blocks[Math.max(0, Math.min(4, idx))];
          }
          out += '\n';
        }
        return out;
      },

      tunnel: (time) => {
        let out = '';
        const cx = cols / 2;
        const cy = rows / 2;
        const t = time * 0.003;
        for (let y = 0; y < rows; y++) {
          for (let x = 0; x < cols; x++) {
            const dx = (x - cx) / 2;
            const dy = y - cy;
            const dist = Math.sqrt(dx * dx + dy * dy) + 0.1;
            const angle = Math.atan2(dy, dx);
            const tunnel = Math.sin(10 / dist + angle * 2 + t * 3);
            const idx = Math.floor((tunnel + 1) * 2.4);
            out += chars.blocks[Math.max(0, Math.min(4, idx))];
          }
          out += '\n';
        }
        return out;
      },

      rain: (() => {
        let drops = [];
        return (time) => {
          if (drops.length < 200) {
            for (let i = 0; i < 200 - drops.length; i++) {
              drops.push({
                x: Math.random() * cols,
                y: Math.random() * rows,
                speed: 0.5 + Math.random() * 1,
                length: 3 + Math.floor(Math.random() * 8),
                char: '|'
              });
            }
          }
          const grid = Array(rows).fill(null).map(() => Array(cols).fill(' '));
          drops.forEach(drop => {
            drop.y += drop.speed;
            if (drop.y > rows + drop.length) {
              drop.y = -drop.length;
              drop.x = Math.random() * cols;
            }
            for (let i = 0; i < drop.length; i++) {
              const py = Math.floor(drop.y - i);
              const px = Math.floor(drop.x);
              if (py >= 0 && py < rows && px >= 0 && px < cols) {
                const intensity = 1 - (i / drop.length);
                grid[py][px] = intensity > 0.7 ? '│' : intensity > 0.4 ? '¦' : '·';
              }
            }
          });
          return grid.map(row => row.join('')).join('\n');
        };
      })(),

      noise: (time) => {
        let out = '';
        const t = time * 0.002;
        for (let y = 0; y < rows; y++) {
          for (let x = 0; x < cols; x++) {
            const n1 = Math.sin(x * 0.1 + t) * Math.cos(y * 0.12 + t * 0.8);
            const n2 = Math.sin((x + y) * 0.07 + t * 0.6);
            const n3 = Math.cos(x * 0.15 - y * 0.08 + t * 1.2);
            const v = (n1 + n2 + n3) / 3;
            const idx = Math.floor((v + 1) * 4.5);
            out += chars.dense[Math.max(0, Math.min(9, idx))];
          }
          out += '\n';
        }
        return out;
      },

      pulse: (time) => {
        let out = '';
        const cx = cols / 2;
        const cy = rows / 2;
        const t = time * 0.004;
        for (let y = 0; y < rows; y++) {
          for (let x = 0; x < cols; x++) {
            const dx = (x - cx) / 2.5;
            const dy = y - cy;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const pulse = Math.sin(dist * 0.5 - t);
            const idx = Math.floor((pulse + 1) * 2.4);
            out += chars.blocks[Math.max(0, Math.min(4, idx))];
          }
          out += '\n';
        }
        return out;
      },

      warp: (time) => {
        let out = '';
        const cx = cols / 2;
        const cy = rows / 2;
        const t = time * 0.001;
        for (let y = 0; y < rows; y++) {
          for (let x = 0; x < cols; x++) {
            const dx = (x - cx) / cols;
            const dy = (y - cy) / rows;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const warp = Math.sin(dist * 20 - t * 5) * Math.exp(-dist * 3);
            const idx = Math.floor((warp + 1) * 2.4);
            out += chars.blocks[Math.max(0, Math.min(4, idx))];
          }
          out += '\n';
        }
        return out;
      },

      dna: (time) => {
        const grid = Array(rows).fill(null).map(() => Array(cols).fill(' '));
        const cy = rows / 2;
        const t = time * 0.003;

        for (let x = 0; x < cols; x++) {
          const phase = x * 0.15 + t;
          const amp = rows * 0.35;
          const y1 = Math.floor(cy + Math.sin(phase) * amp);
          const y2 = Math.floor(cy - Math.sin(phase) * amp);

          if (y1 >= 0 && y1 < rows) grid[y1][x] = '●';
          if (y2 >= 0 && y2 < rows) grid[y2][x] = '○';

          // Connecting bars
          if (Math.abs(Math.sin(phase)) < 0.4) {
            const minY = Math.min(y1, y2);
            const maxY = Math.max(y1, y2);
            for (let y = minY + 1; y < maxY; y++) {
              if (y >= 0 && y < rows) {
                grid[y][x] = (y - minY) % 3 === 0 ? '┃' : '│';
              }
            }
          }
        }
        return grid.map(row => row.join('')).join('\n');
      }
    };

    // Animation loop
    function animate(time) {
      // FPS counter
      frameCount++;
      if (time - lastTime >= 1000) {
        document.getElementById('fps').textContent = frameCount + ' FPS';
        frameCount = 0;
        lastTime = time;
      }

      // Render current effect
      if (effects[currentEffect]) {
        canvas.textContent = effects[currentEffect](time);
      }

      requestAnimationFrame(animate);
    }

    // Effect buttons
    document.querySelectorAll('[data-effect]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-effect]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentEffect = btn.dataset.effect;
        document.getElementById('effect-name').textContent = currentEffect.toUpperCase();
      });
    });

    // Color mode buttons
    document.querySelectorAll('[data-mode]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-mode]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.body.className = 'mode-' + btn.dataset.mode;
      });
    });

    // Keyboard shortcuts
    const effectKeys = ['plasma', 'matrix', 'wave', 'spiral', 'tunnel', 'rain', 'noise', 'pulse', 'warp', 'dna'];
    const modeKeys = ['void', 'cyber', 'neon', 'fire', 'ice', 'acid', 'vapor', 'blood', 'gold', 'rainbow'];

    document.addEventListener('keydown', (e) => {
      // Number keys for effects
      if (e.key >= '1' && e.key <= '9') {
        const idx = parseInt(e.key) - 1;
        if (effectKeys[idx]) {
          currentEffect = effectKeys[idx];
          document.querySelectorAll('[data-effect]').forEach(b => b.classList.remove('active'));
          document.querySelector(`[data-effect="${currentEffect}"]`)?.classList.add('active');
          document.getElementById('effect-name').textContent = currentEffect.toUpperCase();
        }
      }
      if (e.key === '0') {
        currentEffect = effectKeys[9];
        document.querySelectorAll('[data-effect]').forEach(b => b.classList.remove('active'));
        document.querySelector(`[data-effect="${currentEffect}"]`)?.classList.add('active');
        document.getElementById('effect-name').textContent = currentEffect.toUpperCase();
      }

      // Space to shuffle
      if (e.key === ' ') {
        e.preventDefault();
        currentEffect = effectKeys[Math.floor(Math.random() * effectKeys.length)];
        const mode = modeKeys[Math.floor(Math.random() * modeKeys.length)];
        document.body.className = 'mode-' + mode;
        document.querySelectorAll('[data-effect]').forEach(b => b.classList.remove('active'));
        document.querySelector(`[data-effect="${currentEffect}"]`)?.classList.add('active');
        document.querySelectorAll('[data-mode]').forEach(b => b.classList.remove('active'));
        document.querySelector(`[data-mode="${mode}"]`)?.classList.add('active');
        document.getElementById('effect-name').textContent = currentEffect.toUpperCase();
      }

      // Arrow keys for colors
      if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
        const currentMode = document.body.className.replace('mode-', '');
        let idx = modeKeys.indexOf(currentMode);
        idx = e.key === 'ArrowRight' ? (idx + 1) % modeKeys.length : (idx - 1 + modeKeys.length) % modeKeys.length;
        document.body.className = 'mode-' + modeKeys[idx];
        document.querySelectorAll('[data-mode]').forEach(b => b.classList.remove('active'));
        document.querySelector(`[data-mode="${modeKeys[idx]}"]`)?.classList.add('active');
      }
    });

    // Start
    requestAnimationFrame(animate);
  </script>
</body>
</html>
